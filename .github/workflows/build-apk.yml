name: Build Debug APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify active Java version
        run: |
          java -version
          javac -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK with Gradle
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output exists
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${APK_PATH}" ]; then
            echo "::error::Expected APK not found at ${APK_PATH}"
            exit 1
          fi
          ls -lh "${APK_PATH}"

      - name: Upload APK Actions artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true

      - name: Publish APK to GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="apk-run-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Aperture Pro Debug APK (Run #${GITHUB_RUN_NUMBER}, Attempt ${GITHUB_RUN_ATTEMPT})"
          ASSET_FILENAME="app-debug-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          ASSET_PATH="app/build/outputs/apk/debug/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "${ASSET_PATH}"

          if ! gh release create "${RELEASE_TAG}" "${ASSET_PATH}#${ASSET_FILENAME}" \
            --title "${RELEASE_TITLE}" \
            --notes "Automated debug APK build from commit ${GITHUB_SHA}. Download ${ASSET_FILENAME} directly from the Assets section below." \
            --target "${GITHUB_SHA}" \
            --latest; then
            echo "::warning::GitHub Release publishing failed for tag ${RELEASE_TAG}. The APK build and Actions artifact upload (app-debug-apk) succeeded and remain available."
            exit 1
          fi

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          RELEASE_TAG="apk-run-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Aperture Pro Debug APK (Run #${GITHUB_RUN_NUMBER}, Attempt ${GITHUB_RUN_ATTEMPT})"
          ASSET_FILENAME="app-debug-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"

          if [ "${RELEASE_OUTCOME}" = "success" ] && gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url --jq '.url')
            CONFIRMED_TAG=$(gh release view "${RELEASE_TAG}" --json tagName --jq '.tagName')
            CONFIRMED_TITLE=$(gh release view "${RELEASE_TAG}" --json name --jq '.name')

            echo "Release Publishing Status: SUCCESS"
            echo "Release Tag: ${CONFIRMED_TAG}"
            echo "Release Title: ${CONFIRMED_TITLE}"
            echo "GitHub Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_FILENAME}"
            echo "Download the .apk file directly from the release Assets section."
            echo "The normal Actions artifact (app-debug-apk) is also available as a backup."

            {
              echo "## APK Build & Release Summary"
              echo "- **APK Build:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Actions Artifact Upload:** Succeeded (\`app-debug-apk\`)"
              echo "- **GitHub Release Publishing:** Succeeded"
              echo "- **Release Tag:** \`${CONFIRMED_TAG}\`"
              echo "- **Release Title:** ${CONFIRMED_TITLE}"
              echo "- **Direct Release Page URL:** ${RELEASE_URL}"
              echo "- **Exact APK Asset Filename:** \`${ASSET_FILENAME}\`"
              echo ""
              echo "You can download the installable \`.apk\` file directly on your phone from the **Assets** section of the GitHub Release page linked above."
              echo "The standard GitHub Actions artifact named \`app-debug-apk\` is also available on this workflow run summary page as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing failed or could not be verified. However, the APK build succeeded and the Actions artifact named app-debug-apk remains available."
            echo "APK Build Status: SUCCESS"
            echo "Backup Artifact Name: app-debug-apk"

            {
              echo "## APK Build & Release Summary"
              echo "- **APK Build:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Actions Artifact Upload:** Succeeded (\`app-debug-apk\`)"
              echo "- **GitHub Release Publishing:** Failed (Warning)"
              echo ""
              echo "> **Warning:** Publishing the GitHub Release did not succeed, but the APK build itself completed and was not lost."
              echo ""
              echo "### How to Download Your APK"
              echo "Download the Actions artifact named **\`app-debug-apk\`** from the **Artifacts** section of this workflow run page and extract \`app-debug.apk\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Remove temporary debug keystore
        if: always()
        run: |
          rm -f debug.keystore
